<style>
/* layout: one notebook page; summary strip, then a ruled ledger where each ball is one line you can open */
:root {
  --paper: #fbf8f1; --sheet: #fffdf7; --ink: #23262d; --soft: #6b6f78; --grid: rgba(70,125,195,.16);
  --hl: #ffe45c; --strong: #e5484d; --weak: #2f6fd6; --ok: #2a9d8f; --track: #ece6d8;
  --display: "LXGW WenKai TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "Patrick Hand", "LXGW WenKai TC", ui-rounded, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1b1d22; --sheet: #22252b; --ink: #ece8df; --soft: #a3a7b0; --grid: rgba(120,160,220,.12);
  --hl: #8a7a1c; --strong: #ff7a7f; --weak: #79a8ff; --ok: #5cc8b9; --track: #33363e; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1b1d22; --sheet: #22252b; --ink: #ece8df; --soft: #a3a7b0; --grid: rgba(120,160,220,.12);
  --hl: #8a7a1c; --strong: #ff7a7f; --weak: #79a8ff; --ok: #5cc8b9; --track: #33363e; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 16px; line-height: 1.55;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.wrap { max-width: 1020px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 60px; display: grid; gap: 20px; }
h1 { font-size: clamp(30px, 6vw, 46px); margin: 0; line-height: 1.1; text-wrap: balance; }
h1 span { background: linear-gradient(transparent 55%, var(--hl) 55%); padding: 0 4px; }
.lede { margin: 6px 0 0; color: var(--soft); max-width: 65ch; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--sheet); border: 2.5px solid var(--ink); border-radius: 12px 14px 12px 16px; box-shadow: 4px 4px 0 var(--ink); padding: 12px 14px; min-width: 0; }
.tile b { font-family: var(--num); font-size: 34px; line-height: 1; }
.tile .lab { display: block; font-size: 14px; color: var(--soft); }
.tile .who { font-size: 14px; margin-top: 4px; }
.tile.s b { color: var(--strong); } .tile.w b { color: var(--weak); } .tile.o b { color: var(--ok); }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tools input, .tools select { font: inherit; color: var(--ink); background: var(--sheet); border: 2px solid var(--ink); border-radius: 8px; padding: 6px 10px; }
.tools input { flex: 1 1 180px; min-width: 0; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; background: var(--sheet); color: var(--ink); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--hl); font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible, .row:focus-visible { outline: 3px solid var(--weak); outline-offset: 2px; }
.ledger { background: var(--sheet); border: 2.5px solid var(--ink); border-radius: 14px 12px 16px 12px; box-shadow: 5px 5px 0 var(--ink); overflow: hidden; }
.head, .row { display: grid; grid-template-columns: 34px 44px minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1.05fr) 52px 64px; gap: 10px; align-items: center; padding: 8px 14px; }
.head { font-size: 13px; color: var(--soft); border-bottom: 2px solid var(--ink); }
.head button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.head button.on { color: var(--ink); font-weight: 700; text-decoration: underline wavy var(--hl); }
.row { border-bottom: 1px dashed var(--grid); cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--hl) 14%, transparent); }
.rk { font-family: var(--num); font-size: 18px; color: var(--soft); font-variant-numeric: tabular-nums; }
.ball { width: 36px; height: 36px; border-radius: 50%; background: var(--c); border: 2.5px solid #23262d; box-shadow: 2px 2px 0 #23262d; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; text-shadow: 0 0 2px #23262d, 0 0 2px #23262d; }
.nm { min-width: 0; } .nm b { display: block; font-size: 17px; } .nm small { color: var(--soft); font-size: 12px; }
.bar { position: relative; height: 18px; background: var(--track); border-radius: 9px; border: 1.5px solid var(--ink); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--fill); border-right: 1.5px solid var(--ink); }
.bar .mid { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dotted var(--ink); }
.cell { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.pct { font-family: var(--num); font-size: 19px; text-align: right; font-variant-numeric: tabular-nums; }
.dur { font-family: var(--num); font-size: 17px; text-align: right; color: var(--soft); font-variant-numeric: tabular-nums; }
.pill { font-size: 13px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 8px; text-align: center; white-space: nowrap; background: var(--sheet); }
.pill.s { background: color-mix(in srgb, var(--strong) 30%, var(--sheet)); } .pill.w { background: color-mix(in srgb, var(--weak) 28%, var(--sheet)); }
.det { padding: 4px 14px 14px 102px; border-bottom: 1px dashed var(--grid); display: grid; gap: 8px; background: color-mix(in srgb, var(--hl) 8%, transparent); }
.det p { margin: 0; max-width: 65ch; }
.mu { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.mu div { min-width: 0; } .mu h4 { margin: 0 0 4px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 13px; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 6px; background: var(--sheet); }
.note { font-size: 14px; color: var(--soft); max-width: 70ch; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--soft); }
@media (max-width: 720px) {
  .head { display: none; }
  .row { grid-template-columns: 28px 40px minmax(0, 1fr) 56px; grid-template-areas: "rk ball nm pill" "a a a a" "b b b b"; row-gap: 6px; }
  .row .rk { grid-area: rk; } .row .ball { grid-area: ball; } .row .nm { grid-area: nm; } .row .pill { grid-area: pill; }
  .row .c1 { grid-area: a; } .row .c2 { grid-area: b; } .row .dur { display: none; }
  .cell { grid-template-columns: 56px minmax(0, 1fr) 44px; } .cell::before { content: attr(data-l); font-size: 12px; color: var(--soft); }
  .det { padding-left: 14px; }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }
</style>

  const me = idx[r.k], others = ORDER.filter(o => o !== r.k), wins = [], losses = [];
  others.forEach((o, j) => { const c = r.m[j]; if (c === '2') wins.push(o); else if (c === '0') losses.push(o); });
  const nm = k => R.find(x => x.k === k).n, ch = a => a.length ? a.map(k => '<span class="chip">' + nm(k) + '</span>').join('') : '<span class="chip">沒有</span>';
  return '<div class="det"><p>' + r.d + '</p><div class="mu"><div><h4>兩場都贏（' + wins.length + ' 顆）</h4><div class="chips">' + ch(wins) + '</div></div><div><h4>兩場都輸（' + losses.length + ' 顆）</h4><div class="chips">' + ch(losses) + '</div></div></div></div>';
}
function draw() {
  head();
  const q = document.getElementById('q').value.trim(), b = +document.getElementById('batch').value;
  const ranked = R.slice().sort((a, c) => c.w1 - a.w1); ranked.forEach((r, i) => r.rk = i + 1);
  let list = R.filter(r => (!q || r.n.includes(q)) && (!b || r.b === b) && (filt === 'all' || r.v === filt));
  list.sort((a, c) => sortKey === 'n' ? a.n.localeCompare(c.n, 'zh-Hant') * sortDir : (a[sortKey] - c[sortKey]) * sortDir);
  document.getElementById('rows').innerHTML = list.map(r => '<div class="row" tabindex="0" role="button" aria-expanded="' + (open === r.k) + '" data-k="' + r.k + '"><span class="rk">' + r.rk + '</span><span class="ball" style="--c:' + r.c + '">' + r.g + '</span><span class="nm"><b>' + r.n + '</b><small>' + BATCH[r.b] + '</small></span>' +
    '<span class="cell c1" data-l="1v1">' + bar(r.w1, 0.5, 1, fillFor(r.w1, 0.32, 0.68)) + '<span class="pct">' + pct(r.w1) + '</span></span>' +
    '<span class="cell c2" data-l="混戰">' + bar(r.bwr, 1 / 6, 1, fillFor(r.bwr, 0.04, 0.4)) + '<span class="pct">' + pct(r.bwr) + '</span></span>' +
    '<span class="dur">' + r.t + 's</span><span class="pill ' + r.v + '">' + (r.v === 's' ? '偏強' : r.v === 'w' ? '偏弱' : '正常') + '</span></div>' + (open === r.k ? detail(r) : '')).join('') || '<p style="padding:16px">沒有符合的球。</p>';
}
document.getElementById('head').addEventListener('click', e => { const t = e.target.closest('[data-s]'); if (!t) return; const k = t.dataset.s; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'n' ? 1 : -1; } draw(); });
document.getElementById('rows').addEventListener('click', e => { const t = e.target.closest('.row'); if (!t) return; open = open === t.dataset.k ? null : t.dataset.k; draw(); });
document.getElementById('rows').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) { e.preventDefault(); e.target.click(); } });
document.getElementById('q').addEventListener('input', draw);
document.getElementById('batch').addEventListener('change', draw);
document.querySelector('.seg').addEventListener('click', e => { const t = e.target.closest('[data-f]'); if (!t) return; filt = t.dataset.f; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === t)); draw(); });
draw();
</script>
